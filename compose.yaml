version: "3.9"

services:
  backend:
    build: ./backend
    container_name: express-ts-api
    tty: true
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # - /app/node_modules
    depends_on:
      - db
    networks:
      - app-network
    # command: npm run dev

  # todo frontend を書き加える
  frontend:
    build: ./frontend
    container_name: vite-react
    tty: true
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # - /app/vite-my-project/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8000

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge